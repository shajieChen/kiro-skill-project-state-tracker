# Structural constraints for status.yaml. Used by tools/validate_status.py.
# This is a lightweight, hand-rolled schema (not JSON Schema) — only enforces
# the rules that actually matter for this skill.

required_top_level_keys:
  - project
  - artifacts
  - research_findings
  - evidence
  - assumptions
  - decisions
  - blockers
  - gates
  - preconditions
  - dependencies
  - change_events
  - handoff_contexts
  - snapshots
  - rules

project:
  required_fields: [name, phase, version]

artifact_statuses:
  - draft
  - reviewed
  - approved
  - ready
  - blocked
  - needs_update
  - invalidated
  - deprecated
  - archived

artifact_types:
  - plan
  - landing_prompt
  - test_prompt

artifact_required_fields:
  - id
  - type
  - path
  - status

artifact_id_prefixes:
  plan: ["Plan."]
  landing_prompt: ["LandingPrompt.", "LP-", "LP."]
  test_prompt: ["TestPrompt.", "TP-", "TP."]

research_finding_required_fields:
  - id
  - title
  - path

research_finding_id_prefix: "R-"

evidence_required_fields:
  - label
  - source

evidence_label_prefix: "E-"

decision_required_fields:
  - id
  - title
  - path
  - status

decision_id_prefix: "D-"

blocker_required_fields:
  - id
  - title
  - severity
  - status

blocker_id_prefix: "B-"
blocker_severities: [low, medium, high, critical]
blocker_statuses: [open, mitigated, closed]

gate_required_fields:
  - id
  - name
  - status

gate_id_prefix: "G-"
gate_statuses: [pending, passing, failed]

precondition_required_fields:
  - id
  - target
  - requires
  - status

precondition_id_prefix: "PC-"
precondition_statuses: [pending, passing, failed]

change_event_required_fields:
  - id
  - time
  - source
  - event_type
  - affected
  - transitions

change_event_id_prefix: "CE-"

snapshots_required_fields:
  - enabled
  - file_hashes

rules_required_fields:
  - research_is_fact_only
  - status_is_single_source_of_truth
  - landing_requires_test_ready
  - plan_invalidates_landing
  - landing_invalidates_test

# HandoffContext schema additions.
handoff_required_fields:
  - id
  - title
  - producer
  - status
  - version

handoff_id_prefix: "HC-"

handoff_statuses:
  - draft
  - available
  - consumed
  - partially_consumed
  - stale
  - invalidated
  - deprecated
  - archived

handoff_consumer_statuses:
  - pending
  - consumed
  - stale
  - rejected

handoff_fact_required_fields:
  - id
  - statement
  - source

handoff_constraint_required_fields:
  - id
  - statement
  - source

handoff_result_required_fields:
  - id

handoff_blocking_statuses:
  - stale
  - invalidated
  - deprecated
  - archived
